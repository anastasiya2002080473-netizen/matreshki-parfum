
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Матрешки Парфюм</title>
<style>
:root{--bg:#111;--card:#1b1b1b;--text:#f7f4ef;--muted:#a8a39b;--line:#35332f;--gold:#c5a879}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:28px 18px 18px;text-align:center;border-bottom:1px solid var(--line)}
.logo{font-family:Georgia,serif;font-size:30px;letter-spacing:4px}
.subtitle{font-size:10px;letter-spacing:3px;color:var(--gold);margin-top:9px}
main{max-width:900px;margin:auto;padding:20px 15px 45px}
.intro{font-family:Georgia,serif;font-size:25px;margin:8px 0}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0 20px}
input,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:13px;font-size:14px;outline:none}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.product img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#292723;display:block}
.product-info{padding:12px}
.brand{font-size:10px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}
.name{font-family:Georgia,serif;font-size:18px;margin:7px 0}
.desc{font-size:12px;color:var(--muted);line-height:1.45;min-height:34px}
.price{font-size:15px;margin:12px 0}
button,.buy{border:1px solid var(--gold);background:var(--gold);color:#17130e;padding:12px 10px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;font-size:13px;display:block;width:100%}
.empty{padding:30px 10px;text-align:center;color:var(--muted);grid-column:1/-1}
footer{text-align:center;padding:25px 10px;color:var(--muted);font-size:11px;letter-spacing:1px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}main{padding-top:30px}.logo{font-size:36px}}
</style>
</head>
<body>
<header>
  <div class="logo">МАТРЕШКИ</div>
  <div class="subtitle">PARFUM · NICHE & RARE</div>
</header>
<main>
  <div class="intro">Ароматы с характером</div>
  <div class="note">Нишевая парфюмерия в распиве. Выбирай аромат, знакомься с доступными объёмами и оформляй заказ у менеджера.</div>
  <input id="search" placeholder="⌕  Поиск аромата или бренда">
  <div class="filters">
    <select id="category">
      <option value="">Все направления</option>
      <option value="Гурманские">Гурманские</option>
      <option value="Свежие">Свежие</option>
      <option value="Цветочные">Цветочные</option>
      <option value="Древесные">Древесные</option>
    </select>
    <select id="sort">
      <option value="default">Сначала популярные</option>
      <option value="low">Сначала дешевле</option>
      <option value="high">Сначала дороже</option>
      <option value="az">По названию</option>
    </select>
  </div>
  <div class="grid" id="products"></div>
</main>
<footer>МАТРЕШКИ PARFUM · АРОМАТЫ, КОТОРЫЕ ОСТАЮТСЯ</footer>
<script>
const MANAGERS=[
  {name:"Натали",url:"https://t.me/ciaonatalie"},
  {name:"Натали",url:"https://t.me/hellonatalii"}
];

// Демонстрационные товары. Позже заменим их данными из каталога бота.
const products=[
 {brand:"Profumum Roma",name:"Пример аромата № 1",category:"Гурманские",description:"Добавим описание и ноты аромата.",price:900,volumes:"2 мл · 5 мл · 10 мл",manager:0,image:""},
 {brand:"Niche Parfum",name:"Пример аромата № 2",category:"Свежие",description:"Лёгкое знакомство с нишевой парфюмерией.",price:650,volumes:"2 мл · 5 мл · 10 мл",manager:1,image:""},
 {brand:"Niche Parfum",name:"Пример аромата № 3",category:"Древесные",description:"Здесь появятся реальные ноты и описание.",price:750,volumes:"2 мл · 5 мл · 10 мл",manager:0,image:""}
];

const placeholder='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500"><rect width="100%" height="100%" fill="#24221f"/><text x="50%" y="47%" fill="#c5a879" text-anchor="middle" font-family="Georgia" font-size="28">MATRESHKI</text><text x="50%" y="54%" fill="#aaa" text-anchor="middle" font-size="12" letter-spacing="4">PARFUM</text></svg>`);

function render(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 const cat=document.getElementById('category').value;
 const sort=document.getElementById('sort').value;
 let list=products.filter(p=>(p.name+' '+p.brand+' '+p.description).toLowerCase().includes(q)&&(!cat||p.category===cat));
 if(sort==='low')list.sort((a,b)=>a.price-b.price);
 if(sort==='high')list.sort((a,b)=>b.price-a.price);
 if(sort==='az')list.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
 const root=document.getElementById('products');
 root.innerHTML='';
 if(!list.length){root.innerHTML='<div class="empty">Ничего не найдено. Попробуй изменить поиск.</div>';return;}
 list.forEach(p=>{
  const card=document.createElement('article');
  card.className='product';
  const img=document.createElement('img');
  img.src=p.image||placeholder;img.alt=p.brand+' '+p.name;
  const info=document.createElement('div');info.className='product-info';
  const brand=document.createElement('div');brand.className='brand';brand.textContent=p.brand;
  const name=document.createElement('div');name.className='name';name.textContent=p.name;
  const desc=document.createElement('div');desc.className='desc';desc.textContent=p.description;
  const price=document.createElement('div');price.className='price';price.textContent='от '+p.price.toLocaleString('ru-RU')+' ₽';
  const volumes=document.createElement('div');volumes.className='desc';volumes.textContent=p.volumes;
  const buy=document.createElement('button');buy.className='buy';buy.textContent='Уточнить и купить';
  buy.addEventListener('click',()=>window.open(MANAGERS[p.manager].url,'_blank','noopener'));
  info.append(brand,name,desc,price,volumes,buy);card.append(img,info);root.append(card);
 });
}
['search','category','sort'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));
render();
</script>
</body>
</html>
